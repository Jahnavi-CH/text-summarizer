model:
  name: "facebook/bart-base"
  max_input_length: 512
  max_target_length: 128

data:
  dataset_name: "knkarthick/samsum"
  train_subset_size: 20   # Keeps training fast on Colab T4 (~10 mins) or CPU
  val_subset_size: 10
  test_subset_size: 200
  processed_dir: "artifacts/processed_data"

training:
  output_dir: "artifacts/model_checkpoints"
  final_model_dir: "artifacts/fine_tuned_bart"
  num_train_epochs: 1
  per_device_train_batch_size: 4
  per_device_eval_batch_size: 4
  learning_rate: 5.0e-5
  weight_decay: 0.01
  warmup_steps: 100

evaluation:
  results_file: "artifacts/rouge_evaluation.json"
  num_beams: 4
  length_penalty: 1.0